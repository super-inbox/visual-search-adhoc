<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@700;900&family=Manrope:wght@500;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #92400e; } a:hover { color: #78350f; }
    .stage { width:100%; height:100%; display:flex; align-items:stretch; overflow:hidden; font-family:'Manrope', sans-serif;
              background: radial-gradient(circle at 78% 50%, oklch(98% 0.006 90) 0%, oklch(96% 0.008 90) 55%, oklch(94% 0.01 90) 100%); }
    .copy-col { flex:0 0 40%; display:flex; flex-direction:column; justify-content:center; padding: 0 0 0 72px; gap:22px; }
    .brandmark { display:flex; align-items:center; gap:10px; }
    .brandmark .symwrap { width:30px; height:30px; }
    .brandmark .cn { font-family:'Noto Sans SC', sans-serif; font-weight:900; font-size:16px; color: oklch(24% 0.02 260); }
    .headline .cn { font-family:'Noto Sans SC', sans-serif; font-weight:900; font-size:44px; line-height:1.2; color: oklch(22% 0.02 260); }
    .headline .en { margin-top:8px; font-weight:700; font-size:13px; letter-spacing:2px; color: oklch(35% 0.02 260 / 0.7); text-transform:uppercase; }
    .cta { align-self:flex-start; margin-top:10px; padding:14px 30px; border-radius:999px;
           background: oklch(30% 0.05 25); color: oklch(98% 0.01 90); font-family:'Noto Sans SC', sans-serif;
           font-weight:700; font-size:15px; box-shadow: 0 12px 24px oklch(30% 0.05 25 / 0.3); }
    .row { flex:1; display:flex; align-items:flex-end; justify-content:center; gap:44px; padding: 30px 60px 46px; }
    .ground-shadow { position:absolute; }
  </style>
</helmet>
<div class="stage">
  <div class="copy-col">
    <div class="brandmark">
      <div class="symwrap"><dc-import name="SproutBubbleSymbol" hint-size="30,30"></dc-import></div>
      <div class="cn">荔泉气泡</div>
    </div>
    <div class="headline">
      <div class="cn">轻盈气泡<br/>源头养分</div>
      <div class="en">Lichuan Sparkling</div>
    </div>
    <div class="cta">立即选购 · Shop Now</div>
  </div>
  <div class="row">
    <dc-import name="Can" dominant="oklch(83% 0.08 18)" flavor-c-n="荔枝玫瑰" flavor-e-n="Lychee Rose" flavor-icon="lychee" hint-size="150,330"></dc-import>
    <dc-import name="Can" dominant="oklch(80% 0.09 155)" flavor-c-n="黄瓜薄荷" flavor-e-n="Cucumber Mint" flavor-icon="mint" hint-size="150,330"></dc-import>
    <dc-import name="Can" dominant="oklch(86% 0.09 85)" flavor-c-n="柚子姜片" flavor-e-n="Yuzu Ginger" flavor-icon="yuzu" hint-size="150,330"></dc-import>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>
